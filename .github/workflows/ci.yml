name: CI

on:
  push:

permissions:
  contents: read

jobs:
  database-contract:
    name: Supabase ownership contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: contract-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client and libpq headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client libpq-dev

      - name: Run P1F Linux runtime idle and native tests
        shell: bash
        run: |
          set -euo pipefail
          make -C src p1f-runtime-idle-test CC=gcc
          make -C src p1f-runtime-native-test CC=gcc PG_CONFIG=pg_config

      - name: Compile isolated libpq receipt adapter
        shell: bash
        run: |
          set -euo pipefail
          make -C src character-save-journal-v2-receipt-transport-native-compile CC=gcc PG_CONFIG=pg_config

      - name: Gate complete M3 runtime link (Linux + libpq)
        shell: bash
        run: |
          set -euo pipefail
          make -C src m3-runtime-linux-link \
            CC=gcc PG_CONFIG=pg_config \
            M3_RUNTIME_LINK_OUTFILE="$RUNNER_TEMP/muhan-m3-runtime"

      - name: Run identity and onboarding contracts
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:contract-only-password@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          bash supabase/tests/imported_unclaimed_batch_schema_static_contract.sh
          bash supabase/tests/imported_unclaimed_batch_character_provenance_static_contract.sh
          bash supabase/tests/imported_unclaimed_claim_provenance_gate_static_contract.sh
          bash supabase/tests/imported_unclaimed_batch_member_legacy_locator_static_contract.sh
          bash supabase/tests/legacy_locator_resolver_static_contract.sh
          bash supabase/tests/player_snapshot_v1_inventory_graph_shadow_static_contract.sh
          bash supabase/tests/bank_snapshot_v1_topology_shadow_static_contract.sh
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/bootstrap_contract.sql
          # Every additive migration is intentionally applied twice: the first
          # pass proves the upgrade and the second proves safe job/CI replay.
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260902000000_game_identity.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260902000000_game_identity.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260903000000_character_onboarding.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260903000000_character_onboarding.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260904000000_onboarding_intent_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260904000000_onboarding_intent_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260905000000_claim_fingerprint_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260905000000_claim_fingerprint_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260906000000_claim_actor_rate_limit.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260906000000_claim_actor_rate_limit.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260907000000_claim_challenge_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260907000000_claim_challenge_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260908000000_service_rpc_fresh_clock.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260908000000_service_rpc_fresh_clock.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260909000000_m3_shadow_receipts.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260909000000_m3_shadow_receipts.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260910000000_m3_shadow_receipt_route_v2.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260910000000_m3_shadow_receipt_route_v2.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/game_identity_contract.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/character_onboarding_contract.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/m3_shadow_receipt_contract.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/m3_shadow_receipt_route_v2_contract.sql
          CLAIM_CHALLENGE_LOCK_EXPIRY_ALLOW_DISPOSABLE=1 bash supabase/tests/claim_challenge_lock_expiry.sh
          SERVICE_RPC_LOCK_EXPIRY_ALLOW_DISPOSABLE=1 bash supabase/tests/service_rpc_lock_expiry.sh
          M3_SHADOW_LOCK_EXPIRY_ALLOW_DISPOSABLE=1 bash supabase/tests/m3_shadow_receipt_lock_expiry.sh

      - name: Run disposable native M3 receipt transport integration
        shell: bash
        env:
          M3_RECEIPT_TRANSPORT_ALLOW_DISPOSABLE: "1"
          M3_RECEIPT_TRANSPORT_DATABASE_URL: postgresql://postgres:contract-only-password@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          make -C src character-save-journal-v2-receipt-transport-integration CC=gcc PG_CONFIG=pg_config
          make -C src character-save-journal-v2-receipt-transport-restart-integration CC=gcc PG_CONFIG=pg_config

      # Keep this after the historical receipt-transport lane: migration 110
      # intentionally adds the one audited membership that the earlier
      # no-membership baseline proves absent.
      - name: Run M3 writer login and startup-session contracts
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:contract-only-password@127.0.0.1:5432/postgres
          M3_WRITER_SESSION_ALLOW_DISPOSABLE: "1"
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260911000000_m3_writer_session.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260911000000_m3_writer_session.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="alter role mud_writer_login password 'm3-rpc-login-password'"
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/m3_writer_session_contract.sql
          make -C src character-save-journal-v2-runtime-native-compile CC=gcc PG_CONFIG=pg_config
          M3_RUNTIME_ALLOW_DISPOSABLE=1 make -C src character-save-journal-v2-runtime-integration CC=gcc PG_CONFIG=pg_config
          make -C src character-save-journal-v2-rpc-transport-native-compile CC=gcc PG_CONFIG=pg_config
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260912000000_m3_live_save_route.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260912000000_m3_live_save_route.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260913000000_m3_provisioning_head_baseline.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260913000000_m3_provisioning_head_baseline.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260918000000_m3_absent_head_seed.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260918000000_m3_absent_head_seed.sql
          M3_RPC_TRANSPORT_ALLOW_DISPOSABLE=1 \
          M3_RPC_TRANSPORT_DATABASE_URL=postgresql://mud_writer_login:m3-rpc-login-password@127.0.0.1:5432/postgres \
            make -C src character-save-journal-v2-rpc-transport-integration CC=gcc PG_CONFIG=pg_config

      - name: Run M3 v3 route, provisioning baseline, and absent-head seed PostgreSQL 17 contracts
        if: runner.os == 'Linux'
        shell: bash
        env:
          M3_LIVE_SAVE_ROUTE_ALLOW_DISPOSABLE: "1"
          M3_PROVISIONING_HEAD_BASELINE_ALLOW_DISPOSABLE: "1"
        run: |
          set -euo pipefail
          bash supabase/tests/m3_live_save_route_pg17_integration.sh
          bash supabase/tests/m3_provisioning_head_baseline_pg17_integration.sh

      - name: Run isolated legacy identity evidence binding PostgreSQL contract
        shell: bash
        env:
          PGPASSWORD: contract-only-password
        run: |
          set -euo pipefail
          evidence_database=legacy_identity_evidence_contract
          evidence_database_url="postgresql://postgres:contract-only-password@127.0.0.1:5432/${evidence_database}"
          createdb --host=127.0.0.1 --username=postgres "${evidence_database}"
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 --file=supabase/tests/bootstrap_contract.sql
          # Start at the identity schema: the earlier lobby-presence migration
          # depends on Realtime, which this minimal disposable bootstrap omits.
          migrations=(
            supabase/migrations/20260902000000_game_identity.sql
            supabase/migrations/20260903000000_character_onboarding.sql
            supabase/migrations/20260904000000_onboarding_intent_safety.sql
            supabase/migrations/20260905000000_claim_fingerprint_safety.sql
            supabase/migrations/20260906000000_claim_actor_rate_limit.sql
            supabase/migrations/20260907000000_claim_challenge_safety.sql
            supabase/migrations/20260908000000_service_rpc_fresh_clock.sql
            supabase/migrations/20260909000000_m3_shadow_receipts.sql
            supabase/migrations/20260910000000_m3_shadow_receipt_route_v2.sql
            supabase/migrations/20260911000000_m3_writer_session.sql
            supabase/migrations/20260912000000_m3_live_save_route.sql
            supabase/migrations/20260913000000_m3_provisioning_head_baseline.sql
            supabase/migrations/20260914000000_m4_file_snapshot_manifest.sql
            supabase/migrations/20260915000000_player_snapshot_v1_artifacts.sql
            supabase/migrations/20260916000000_player_snapshot_v1_receipt_octets_binding.sql
            supabase/migrations/20260917000000_player_snapshot_v1_replay_reader.sql
            supabase/migrations/20260918000000_m3_absent_head_seed.sql
            supabase/migrations/20260919000000_player_snapshot_v1_level_projection.sql
            supabase/migrations/20260920000000_player_snapshot_v1_level_projection_replay_reader.sql
            supabase/migrations/20260921000000_legacy_identity_evidence_binding.sql
          )
          # The first pass proves the upgrade path; the second proves every
          # additive migration remains safe under CI/job replay.
          for pass in 1 2; do
            for migration in "${migrations[@]}"; do
              psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 --file="${migration}"
            done
          done
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/legacy_identity_evidence_binding_contract.sql
          # Keep the legacy evidence contract pinned at its 210 checkpoint.
          # The handoff gate is deliberately applied only after that contract,
          # then replayed before its own pending-to-active contract runs.
          for pass in 1 2; do
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260922000000_onboarding_handoff_lifecycle.sql
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260922100000_onboarding_handoff_gate.sql
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260923000000_onboarding_snapshot_eligibility_outbox.sql
          done
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/onboarding_handoff_gate_contract.sql
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/onboarding_snapshot_eligibility_outbox_contract.sql
          pva_fixture_hex="$(tr -d '\r\n' < tests/fixtures/player_snapshot_v1_canonical.hex)"
          pva_payload="decode('${pva_fixture_hex}', 'hex')"
          pvi_tree_fixture_hex="$(tr -d '\r\n' < tests/fixtures/player_snapshot_v1_tree_inventory.hex)"
          pvi_tree_payload="decode('${pvi_tree_fixture_hex}', 'hex')"
          if psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --set="pva_payload=${pva_payload}" \
            --file=supabase/tests/onboarding_snapshot_fulfillment_contract.sql; then
            echo "RED unexpectedly passed before onboarding snapshot fulfillment migration" >&2
            exit 1
          fi
          for pass in 1 2; do
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260924000000_onboarding_snapshot_fulfillment.sql
          done
          if psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --set="pva_payload=${pva_payload}" \
            --file=supabase/tests/onboarding_snapshot_fulfillment_contract.sql; then
            echo "RED unexpectedly passed before onboarding snapshot fulfillment corrective migration" >&2
            exit 1
          fi
          for pass in 1 2; do
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260925000000_onboarding_snapshot_fulfillment_corrective.sql
          done
          if psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --set="pva_payload=${pva_payload}" \
            --file=supabase/tests/onboarding_snapshot_fulfillment_contract.sql; then
            echo "RED unexpectedly passed before onboarding snapshot fulfillment terminal-semantics migration" >&2
            exit 1
          fi
          for pass in 1 2; do
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260926000000_onboarding_snapshot_fulfillment_terminal_semantics.sql
          done
          if psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --set="pva_payload=${pva_payload}" \
            --file=supabase/tests/onboarding_snapshot_fulfillment_contract.sql; then
            echo "RED unexpectedly passed before onboarding snapshot command-binding migration" >&2
            exit 1
          fi
          for pass in 1 2; do
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260927000000_onboarding_snapshot_command_binding.sql
          done
          for pass in 1 2; do
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260928000000_imported_unclaimed_batch_ledger.sql
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260929000000_imported_unclaimed_batch_character_provenance.sql
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20260930000000_imported_unclaimed_claim_provenance_gate.sql
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20261001000000_imported_unclaimed_batch_member_legacy_locator.sql
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20261002000000_legacy_locator_resolver.sql
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20261003000000_player_snapshot_v1_inventory_graph_shadow.sql
            psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
              --file=supabase/migrations/20261005000000_bank_snapshot_v1_topology_shadow.sql
          done
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/imported_unclaimed_batch_ledger_contract.sql
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/imported_unclaimed_batch_character_provenance_contract.sql
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/imported_unclaimed_claim_provenance_gate_contract.sql
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/imported_unclaimed_batch_member_legacy_locator_contract.sql
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/legacy_locator_resolver_contract.sql
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --set="pvi_tree_payload=${pvi_tree_payload}" \
            --file=supabase/tests/player_snapshot_v1_inventory_graph_shadow_contract.sql
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/bank_snapshot_v1_topology_shadow_contract.sql
          psql "${evidence_database_url}" --set=ON_ERROR_STOP=1 \
            --set="pva_payload=${pva_payload}" \
            --file=supabase/tests/onboarding_snapshot_fulfillment_contract.sql

      - name: Run M4 file snapshot manifest PostgreSQL 17 contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          make -C src character-snapshot-shadow-outbox-pg17-integration \
            M4_FILE_SNAPSHOT_MANIFEST_ALLOW_DISPOSABLE=1

      - name: Run PlayerSnapshotV1 PostgreSQL 17 artifact contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          PLAYER_SNAPSHOT_V1_ARTIFACT_ALLOW_DISPOSABLE=1 \
            bash supabase/tests/player_snapshot_v1_artifact_pg17_integration.sh

      # The replay-reader gate executes the explicit comparator from dist,
      # before the later filesystem relay E2E consumes the same compiled relay.
      - name: Setup Node for M4 relay contracts
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install, test, typecheck, and build M4 relay contracts
        shell: bash
        working-directory: services/m4-file-snapshot-manifest-relay
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

      - name: Run PlayerSnapshotV1 replay-reader PostgreSQL 17 contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          PLAYER_SNAPSHOT_V1_REPLAY_READER_ALLOW_DISPOSABLE=1 \
            bash supabase/tests/player_snapshot_v1_replay_reader_pg17_integration.sh

      - name: Run BankSnapshotV1 topology adapter PostgreSQL 17 E2E
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BANK_SNAPSHOT_V1_TOPOLOGY_SHADOW_ALLOW_DISPOSABLE=1 \
            bash supabase/tests/bank_snapshot_v1_topology_shadow_pg17_adapter_e2e.sh

      - name: Run PlayerSnapshotV1 Linux filesystem relay PostgreSQL 17 E2E
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          PLAYER_SNAPSHOT_V1_ARTIFACT_RELAY_ALLOW_DISPOSABLE=1 \
            bash supabase/tests/player_snapshot_v1_artifact_relay_pg17_e2e.sh

      - name: Run isolated M3 owner and runtime-shadow PostgreSQL 17 E2E gates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Each harness creates a random-named, loopback-published PostgreSQL
          # 17 container with tmpfs storage, then removes only that container.
          # Do not add docker system prune/volume cleanup here: shared runner
          # storage must remain outside this test's ownership.
          make -C src character-save-journal-v2-process-owner-pg17-integration \
            CC=gcc PG_CONFIG=pg_config \
            M3_PROCESS_OWNER_PG17_ALLOW_DISPOSABLE=1
          make -C src character-save-journal-v2-runtime-shadow-pg17-integration \
            CC=gcc PG_CONFIG=pg_config \
            M3_RUNTIME_SHADOW_PG17_ALLOW_DISPOSABLE=1

      - name: Run named-volume restart harness
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash tests/integration/muhan_v2_named_volume_restart_integration.sh

      - name: Setup Node for importer integration
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install importer dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile --filter @muhan/character-inventory-importer...

      - name: Run disposable Linux/Postgres importer integration
        shell: bash
        env:
          INVENTORY_E2E_ALLOW_DISPOSABLE: "1"
          INVENTORY_E2E_DATABASE_URL: postgresql://postgres:contract-only-password@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          # This primary disposable database has the identity checkpoint but
          # not the later isolated-evidence migrations. Apply the importer's
          # exact immutable batch/provenance/locator prerequisites before its
          # store opens, replaying each as the contract lane does.
          for pass in 1 2; do
            psql "$INVENTORY_E2E_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260928000000_imported_unclaimed_batch_ledger.sql
            psql "$INVENTORY_E2E_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260929000000_imported_unclaimed_batch_character_provenance.sql
            psql "$INVENTORY_E2E_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20261001000000_imported_unclaimed_batch_member_legacy_locator.sql
          done
          pnpm --filter @muhan/character-inventory-importer test:integration

  build-and-smoke:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            smoke_expect_hints: "1"
          - runner: ubuntu-22.04-arm
            smoke_expect_hints: "0"
          - runner: windows-latest
            smoke_expect_hints: "1"
          - runner: macos-latest
            smoke_expect_hints: "1"

    steps:
      - name: Checkout (default)
        if: matrix.runner != 'macos-latest'
        uses: actions/checkout@v4

      - name: Checkout (macOS sparse, manual)
        if: matrix.runner == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git sparse-checkout init --no-cone
          printf '%s\n' \
            '/src/' \
            '/tests/' \
            '/resources_manifest/' \
            '/resources_utf8/' \
            '/rooms/' \
            '/post/' \
            '/log/' \
            '/README.md' > .git/info/sparse-checkout
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      - name: Setup Python (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup MSYS2 (Windows)
        if: matrix.runner == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            gcc
            python

      - name: Install build deps (Ubuntu)
        if: startsWith(matrix.runner, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          make -C src clean >/dev/null 2>&1 || true
          if [[ "${{ matrix.runner }}" == ubuntu* ]]; then
            make -C src -j"$(getconf _NPROCESSORS_ONLN || echo 2)" CC=gcc
          else
            make -C src -j"$(getconf _NPROCESSORS_ONLN || echo 2)" CC=cc
          fi

      - name: Build (Windows/MSYS2)
        if: matrix.runner == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -C src clean >/dev/null 2>&1 || true
          make -C src -j2 CC=gcc

      - name: Run M3 native runtime lifecycle gate (Linux + libpq)
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          make -C src character-save-journal-v2-runtime-native-test \
            CC=gcc PG_CONFIG=pg_config

      - name: Exercise M3 live-save production graph (Linux)
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          make -C src m3-feature-off-legacy-authority-test CC=gcc
          make -C src m3-live-save-all-shadow-binding-test CC=gcc

      - name: Player snapshot portable contract (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          compiler=cc
          if [[ "${{ matrix.runner }}" == ubuntu* ]]; then
            compiler=gcc
          fi
          make -C src player-snapshot-v1-test CC="$compiler"

      - name: Player snapshot portable contract (Windows/MSYS2)
        if: matrix.runner == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -C src player-snapshot-v1-test CC=gcc

      - name: Audit default MUD artifact has no PQ or libpq (Linux)
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          make -C src character-save-journal-v2-rpc-transport-live-mud-audit \
            M3_RPC_TRANSPORT_LIVE_BINARY="$GITHUB_WORKSPACE/src/frp.new"

      - name: Smoke test (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          export MUHAN_HOME="$GITHUB_WORKSPACE"
          log_file="/tmp/frp.log"
          port="$((40000 + RANDOM % 1000))"

          ./src/frp.new -r "$port" >"$log_file" 2>&1 &
          pid=$!

          cleanup() {
            kill -9 "$pid" >/dev/null 2>&1 || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 2
          if ! kill -0 "$pid" >/dev/null 2>&1; then
            echo "smoke failed: server exited immediately"
            tail -n 200 "$log_file" || true
            exit 1
          fi

          if ! MUD_PORT="$port" SMOKE_EXPECT_HINTS='${{ matrix.smoke_expect_hints }}' python tests/smoke/session_smoke.py; then
            echo "smoke failed: session scenario"
            tail -n 200 "$log_file" || true
            exit 1
          fi

      - name: Smoke test (Windows/MSYS2)
        if: matrix.runner == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export MUHAN_HOME="$(pwd)"
          log_file="/tmp/frp.log"
          bin="./src/frp.new"
          port="$((40000 + RANDOM % 1000))"

          if [[ ! -x "$bin" && -x "./src/frp.new.exe" ]]; then
            bin="./src/frp.new.exe"
          fi

          "$bin" -r "$port" >"$log_file" 2>&1 &
          pid=$!

          cleanup() {
            kill -9 "$pid" >/dev/null 2>&1 || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 2
          if ! kill -0 "$pid" >/dev/null 2>&1; then
            echo "smoke failed: server exited immediately"
            tail -n 200 "$log_file" || true
            exit 1
          fi

          if ! MUD_PORT="$port" SMOKE_EXPECT_HINTS='${{ matrix.smoke_expect_hints }}' python tests/smoke/session_smoke.py; then
            echo "smoke failed: session scenario"
            tail -n 200 "$log_file" || true
            exit 1
          fi

      - name: Legacy unit contracts
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          make -C src unit-test CC=gcc
          make -C src character-save-journal-v2-uuid-native-test CC=gcc
          make -C src character-save-journal-v2-deadline-native-test CC=gcc
          python3 tests/unit/player_writer_contract_test.py
          python3 tests/unit/creature_object_layout_contract_test.py

      - name: Onboarding protocol sanitizers
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu89 -fcommon -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src tests/unit/onboarding_admission_test.c \
            src/onboarding_admission.c src/onboarding_session.c \
            src/trusted_admission.c src/player_path.c \
            src/utf8_text.c src/resource_path.c \
            -o "$RUNNER_TEMP/onboarding-admission-sanitized-test"
          ASAN_OPTIONS=detect_leaks=1 \
            "$RUNNER_TEMP/onboarding-admission-sanitized-test"
          gcc -std=gnu89 -fcommon -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src tests/unit/onboarding_receipt_test.c \
            src/onboarding_receipt.c src/resource_path.c \
            -o "$RUNNER_TEMP/onboarding-receipt-sanitized-test"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/onboarding-receipt-sanitized-test"
          gcc -std=gnu89 -fcommon -Wno-error=implicit-function-declaration \
            -ffunction-sections -fdata-sections \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src tests/unit/room_time_test.c src/room.c \
            -Wl,--gc-sections -o "$RUNNER_TEMP/room-time-sanitized-test"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/room-time-sanitized-test"
          gcc -std=gnu89 -fcommon -Wno-error=implicit-function-declaration \
            -ffunction-sections -fdata-sections \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src tests/unit/staged_player_stage_test.c src/player.c \
            -Wl,--gc-sections -o "$RUNNER_TEMP/staged-player-sanitized-test"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/staged-player-sanitized-test"

      - name: CDTO and journal sanitizers
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          make -C src character-save-journal-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-writer-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-writer-bootstrap-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-uuid-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-route-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-publish-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-ack-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-recovery-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-receipt-transport-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-rpc-transport-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-live-ops-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-player-store-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-deadline-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-process-owner-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-runtime-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-crash-sanitizer-test CC=gcc
          make -C src m3-feature-off-legacy-authority-sanitizer-test CC=gcc
          make -C src m3-live-save-all-shadow-binding-sanitizer-test CC=gcc
          make -C src character-snapshot-shadow-outbox-sanitizer-test CC=gcc
          make -C src cdto-v1-sanitizer-test CC=gcc
          make -C src object-v1-sanitizer-test CC=gcc
          make -C src object-graph-v1-sanitizer-test CC=gcc
          make -C src creature-v1-sanitizer-test CC=gcc
          make -C src player-snapshot-v1-sanitizer-test CC=gcc

      - name: Bounded player serializer checks
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          make -C src player-record-serializer-test CC=gcc
          make -C src player-record-serializer-sanitizer-test CC=gcc

      - name: Deterministic AI scenario
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-ai-scenario.sh --output "$RUNNER_TEMP/muhan-ai-scenario.json"

      - name: SIGTERM shutdown scenario
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-shutdown-scenario.sh --output "$RUNNER_TEMP/muhan-shutdown-scenario.json"

      - name: Setup Node for Gateway/Web contracts
        if: matrix.runner == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify Gateway/Web
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile
          pnpm check

      - name: Browser xterm onboarding contract
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser

      - name: Web stack lifecycle unit contract
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir services/gateway exec tsx --test ../../tests/stack-e2e/web-stack-ui.lifecycle.test.ts

      - name: Disposable web onboarding stack acceptance
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-stack-e2e.sh

      - name: Rust CDTO and M3 wake protocol contracts
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml -p muhan-core-dto --all-targets -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml -p muhan-m3-wake-protocol --all-targets -- -D warnings
          ./scripts/run-cdto-differential.sh
          ./scripts/run-m3-wake-differential.sh
          cargo test --manifest-path rust/Cargo.toml --workspace --exclude muhan-m3-wake-protocol

      - name: Trusted admission scenario
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-admission-scenario.sh --output "$RUNNER_TEMP/muhan-admission-scenario.json"

      - name: Real onboarding scenario with ASan and UBSan
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sanitized_binary="$RUNNER_TEMP/muhan-onboarding-sanitized"
          sanitizer_flags='-g -O1 -std=gnu89 -fcommon -DFINGERACCT -DCHECKDOUBLE -DSUICIDE -DOBJLEVEL -DDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer'
          make -B -C src -j2 CC=gcc CFLAGS="$sanitizer_flags" OUTFILE="$sanitized_binary"
          # The scenario deliberately SIGKILLs the server at the SAVED crash
          # window, so LeakSanitizer cannot run its process-exit sweep here.
          # Leak detection remains enabled in the normally exiting unit job.
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
          AI_SCENARIO_ALLOW_EXTERNAL_BINARY=1 \
          AI_SCENARIO_BINARY="$sanitized_binary" \
            ./scripts/run-onboarding-scenario.sh \
              --output "$RUNNER_TEMP/muhan-onboarding-sanitized-scenario.json"

      - name: Upload AI scenario evidence
        if: always() && matrix.runner == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mud-ai-scenario-${{ github.sha }}
          path: |
            ${{ runner.temp }}/muhan-ai-scenario.json
            ${{ runner.temp }}/muhan-shutdown-scenario.json
            ${{ runner.temp }}/muhan-admission-scenario.json
            ${{ runner.temp }}/muhan-onboarding-sanitized-scenario.json
          if-no-files-found: warn
