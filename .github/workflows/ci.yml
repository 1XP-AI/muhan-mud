name: CI

on:
  push:

permissions:
  contents: read

jobs:
  database-contract:
    name: Supabase ownership contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: contract-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run identity and onboarding contracts
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:contract-only-password@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/bootstrap_contract.sql
          # Every additive migration is intentionally applied twice: the first
          # pass proves the upgrade and the second proves safe job/CI replay.
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260902000000_game_identity.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260902000000_game_identity.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260903000000_character_onboarding.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260903000000_character_onboarding.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260904000000_onboarding_intent_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260904000000_onboarding_intent_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260905000000_claim_fingerprint_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260905000000_claim_fingerprint_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260906000000_claim_actor_rate_limit.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260906000000_claim_actor_rate_limit.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260907000000_claim_challenge_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260907000000_claim_challenge_safety.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260908000000_service_rpc_fresh_clock.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260908000000_service_rpc_fresh_clock.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260909000000_m3_shadow_receipts.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260909000000_m3_shadow_receipts.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260910000000_m3_shadow_receipt_route_v2.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260910000000_m3_shadow_receipt_route_v2.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/game_identity_contract.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/character_onboarding_contract.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/m3_shadow_receipt_contract.sql
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=supabase/tests/m3_shadow_receipt_route_v2_contract.sql
          CLAIM_CHALLENGE_LOCK_EXPIRY_ALLOW_DISPOSABLE=1 bash supabase/tests/claim_challenge_lock_expiry.sh
          SERVICE_RPC_LOCK_EXPIRY_ALLOW_DISPOSABLE=1 bash supabase/tests/service_rpc_lock_expiry.sh
          M3_SHADOW_LOCK_EXPIRY_ALLOW_DISPOSABLE=1 bash supabase/tests/m3_shadow_receipt_lock_expiry.sh

      - name: Setup Node for importer integration
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install importer dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile --filter @muhan/character-inventory-importer...

      - name: Run disposable Linux/Postgres importer integration
        shell: bash
        env:
          INVENTORY_E2E_ALLOW_DISPOSABLE: "1"
          INVENTORY_E2E_DATABASE_URL: postgresql://postgres:contract-only-password@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          pnpm --filter @muhan/character-inventory-importer test:integration

  build-and-smoke:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            smoke_expect_hints: "1"
          - runner: ubuntu-22.04-arm
            smoke_expect_hints: "0"
          - runner: windows-latest
            smoke_expect_hints: "1"
          - runner: macos-latest
            smoke_expect_hints: "1"

    steps:
      - name: Checkout (default)
        if: matrix.runner != 'macos-latest'
        uses: actions/checkout@v4

      - name: Checkout (macOS sparse, manual)
        if: matrix.runner == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git sparse-checkout init --no-cone
          printf '%s\n' \
            '/src/' \
            '/tests/' \
            '/resources_manifest/' \
            '/resources_utf8/' \
            '/rooms/' \
            '/post/' \
            '/log/' \
            '/README.md' > .git/info/sparse-checkout
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      - name: Setup Python (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup MSYS2 (Windows)
        if: matrix.runner == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            gcc
            python

      - name: Install build deps (Ubuntu)
        if: startsWith(matrix.runner, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          make -C src clean >/dev/null 2>&1 || true
          if [[ "${{ matrix.runner }}" == ubuntu* ]]; then
            make -C src -j"$(getconf _NPROCESSORS_ONLN || echo 2)" CC=gcc
          else
            make -C src -j"$(getconf _NPROCESSORS_ONLN || echo 2)" CC=cc
          fi

      - name: Build (Windows/MSYS2)
        if: matrix.runner == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -C src clean >/dev/null 2>&1 || true
          make -C src -j2 CC=gcc

      - name: Smoke test (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          export MUHAN_HOME="$GITHUB_WORKSPACE"
          log_file="/tmp/frp.log"
          port="$((40000 + RANDOM % 1000))"

          ./src/frp.new -r "$port" >"$log_file" 2>&1 &
          pid=$!

          cleanup() {
            kill -9 "$pid" >/dev/null 2>&1 || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 2
          if ! kill -0 "$pid" >/dev/null 2>&1; then
            echo "smoke failed: server exited immediately"
            tail -n 200 "$log_file" || true
            exit 1
          fi

          if ! MUD_PORT="$port" SMOKE_EXPECT_HINTS='${{ matrix.smoke_expect_hints }}' python tests/smoke/session_smoke.py; then
            echo "smoke failed: session scenario"
            tail -n 200 "$log_file" || true
            exit 1
          fi

      - name: Smoke test (Windows/MSYS2)
        if: matrix.runner == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export MUHAN_HOME="$(pwd)"
          log_file="/tmp/frp.log"
          bin="./src/frp.new"
          port="$((40000 + RANDOM % 1000))"

          if [[ ! -x "$bin" && -x "./src/frp.new.exe" ]]; then
            bin="./src/frp.new.exe"
          fi

          "$bin" -r "$port" >"$log_file" 2>&1 &
          pid=$!

          cleanup() {
            kill -9 "$pid" >/dev/null 2>&1 || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 2
          if ! kill -0 "$pid" >/dev/null 2>&1; then
            echo "smoke failed: server exited immediately"
            tail -n 200 "$log_file" || true
            exit 1
          fi

          if ! MUD_PORT="$port" SMOKE_EXPECT_HINTS='${{ matrix.smoke_expect_hints }}' python tests/smoke/session_smoke.py; then
            echo "smoke failed: session scenario"
            tail -n 200 "$log_file" || true
            exit 1
          fi

      - name: Legacy unit contracts
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          make -C src unit-test CC=gcc
          python3 tests/unit/player_writer_contract_test.py
          python3 tests/unit/creature_object_layout_contract_test.py

      - name: Onboarding protocol sanitizers
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu89 -fcommon -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src tests/unit/onboarding_admission_test.c \
            src/onboarding_admission.c src/onboarding_session.c \
            src/trusted_admission.c src/player_path.c \
            src/utf8_text.c src/resource_path.c \
            -o "$RUNNER_TEMP/onboarding-admission-sanitized-test"
          ASAN_OPTIONS=detect_leaks=1 \
            "$RUNNER_TEMP/onboarding-admission-sanitized-test"
          gcc -std=gnu89 -fcommon -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src tests/unit/onboarding_receipt_test.c \
            src/onboarding_receipt.c src/resource_path.c \
            -o "$RUNNER_TEMP/onboarding-receipt-sanitized-test"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/onboarding-receipt-sanitized-test"
          gcc -std=gnu89 -fcommon -Wno-error=implicit-function-declaration \
            -ffunction-sections -fdata-sections \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src tests/unit/room_time_test.c src/room.c \
            -Wl,--gc-sections -o "$RUNNER_TEMP/room-time-sanitized-test"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/room-time-sanitized-test"
          gcc -std=gnu89 -fcommon -Wno-error=implicit-function-declaration \
            -ffunction-sections -fdata-sections \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src tests/unit/staged_player_stage_test.c src/player.c \
            -Wl,--gc-sections -o "$RUNNER_TEMP/staged-player-sanitized-test"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/staged-player-sanitized-test"

      - name: CDTO and journal sanitizers
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          make -C src character-save-journal-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-writer-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-route-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-publish-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-ack-sanitizer-test CC=gcc
          make -C src character-save-journal-v2-recovery-sanitizer-test CC=gcc
          make -C src cdto-v1-sanitizer-test CC=gcc
          make -C src object-v1-sanitizer-test CC=gcc
          make -C src object-graph-v1-sanitizer-test CC=gcc
          make -C src creature-v1-sanitizer-test CC=gcc

      - name: Deterministic AI scenario
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-ai-scenario.sh --output "$RUNNER_TEMP/muhan-ai-scenario.json"

      - name: SIGTERM shutdown scenario
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-shutdown-scenario.sh --output "$RUNNER_TEMP/muhan-shutdown-scenario.json"

      - name: Setup Node for Gateway/Web contracts
        if: matrix.runner == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify Gateway/Web
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile
          pnpm check

      - name: Browser xterm onboarding contract
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser

      - name: Rust CDTO clone-only contract
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml -p muhan-core-dto --all-targets -- -D warnings
          ./scripts/run-cdto-differential.sh
          cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Trusted admission scenario
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-admission-scenario.sh --output "$RUNNER_TEMP/muhan-admission-scenario.json"

      - name: Real onboarding scenario with ASan and UBSan
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sanitized_binary="$RUNNER_TEMP/muhan-onboarding-sanitized"
          sanitizer_flags='-g -O1 -std=gnu89 -fcommon -DFINGERACCT -DCHECKDOUBLE -DSUICIDE -DOBJLEVEL -DDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer'
          make -B -C src -j2 CC=gcc CFLAGS="$sanitizer_flags" OUTFILE="$sanitized_binary"
          # The scenario deliberately SIGKILLs the server at the SAVED crash
          # window, so LeakSanitizer cannot run its process-exit sweep here.
          # Leak detection remains enabled in the normally exiting unit job.
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
          AI_SCENARIO_ALLOW_EXTERNAL_BINARY=1 \
          AI_SCENARIO_BINARY="$sanitized_binary" \
            ./scripts/run-onboarding-scenario.sh \
              --output "$RUNNER_TEMP/muhan-onboarding-sanitized-scenario.json"

      - name: Upload AI scenario evidence
        if: always() && matrix.runner == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mud-ai-scenario-${{ github.sha }}
          path: |
            ${{ runner.temp }}/muhan-ai-scenario.json
            ${{ runner.temp }}/muhan-shutdown-scenario.json
            ${{ runner.temp }}/muhan-admission-scenario.json
            ${{ runner.temp }}/muhan-onboarding-sanitized-scenario.json
          if-no-files-found: warn
